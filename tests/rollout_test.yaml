suite: rollout
templates:
  - rollout.yaml
release:
  name: demo
  namespace: apps
set:
  image.repository: nginx
  image.tag: "1.27"
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a Rollout wired to the stable/canary Services and the HTTPRoute
    set:
      rollout.enabled: true
    asserts:
      - isKind:
          of: Rollout
      - isAPIVersion:
          of: argoproj.io/v1alpha1
      - equal:
          path: metadata.name
          value: demo-base-webapp
      - equal:
          path: spec.strategy.canary.stableService
          value: demo-base-webapp-stable
      - equal:
          path: spec.strategy.canary.canaryService
          value: demo-base-webapp-canary
      - equal:
          path: spec.strategy.canary.trafficRouting.plugins["argoproj-labs/gatewayAPI"].httpRoute
          value: demo-base-webapp
      - equal:
          path: spec.strategy.canary.trafficRouting.plugins["argoproj-labs/gatewayAPI"].namespace
          value: apps

  - it: omits steps when none are given (rolling-update-like behavior)
    set:
      rollout.enabled: true
    asserts:
      - notExists:
          path: spec.strategy.canary.steps

  - it: passes steps through as-is, analysis included
    set:
      rollout.enabled: true
      rollout.steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: success-rate
    asserts:
      - equal:
          path: spec.strategy.canary.steps
          value:
            - setWeight: 20
            - pause:
                duration: 30s
            - analysis:
                templates:
                  - templateName: success-rate

  - it: sets replicas from replicaCount when autoscaling is off
    set:
      rollout.enabled: true
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: leaves replicas to the HPA when autoscaling is on
    set:
      rollout.enabled: true
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: uses the same pod spec as the Deployment would
    set:
      rollout.enabled: true
      secretName: app-credentials
      env:
        - name: LOG_LEVEL
          value: info
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:1.27
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: app-credentials
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: LOG_LEVEL
              value: info
