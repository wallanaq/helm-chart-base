suite: hpa
templates:
  - hpa.yaml
release:
  name: demo
set:
  image.repository: nginx
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: targets the Deployment by default, scaling on CPU
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 5
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: demo-base-webapp
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 5
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 80

  - it: targets the Rollout when the rollout is enabled
    set:
      autoscaling.enabled: true
      rollout.enabled: true
    asserts:
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: argoproj.io/v1alpha1
            kind: Rollout
            name: demo-base-webapp

  - it: adds a memory metric when targetMemoryUtilizationPercentage is set
    set:
      autoscaling.enabled: true
      autoscaling.targetMemoryUtilizationPercentage: 75
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 2
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: 75

  - it: fails when minReplicas is greater than maxReplicas
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 5
      autoscaling.maxReplicas: 2
    asserts:
      - failedTemplate:
          errorMessage: autoscaling.minReplicas must not be greater than autoscaling.maxReplicas
