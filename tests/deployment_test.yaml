suite: deployment
templates:
  - deployment.yaml
release:
  name: demo
set:
  image.repository: nginx
  image.tag: "1.27"
tests:
  - it: renders a Deployment by default
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: demo-base-webapp
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:1.27

  - it: sets replicas from replicaCount when autoscaling is off
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: leaves replicas to the HPA when autoscaling is on
    set:
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: falls back to the chart appVersion when image.tag is empty
    set:
      image.tag: ""
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^nginx:.+$

  - it: is not rendered when the rollout is enabled
    set:
      rollout.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: exposes the container port from service.port, named http
    set:
      service.port: 9090
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0]
          value:
            name: http
            containerPort: 9090
            protocol: TCP

  - it: passes env through and injects secretName via envFrom
    set:
      env:
        - name: LOG_LEVEL
          value: info
      secretName: app-credentials
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: LOG_LEVEL
              value: info
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: app-credentials

  - it: injects no env or envFrom unless asked to
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: applies podAnnotations and podLabels to the pod template
    set:
      podAnnotations:
        team: platform
      podLabels:
        tier: web
    asserts:
      - equal:
          path: spec.template.metadata.annotations.team
          value: platform
      - equal:
          path: spec.template.metadata.labels.tier
          value: web
