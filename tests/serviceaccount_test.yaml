suite: serviceaccount
templates:
  - serviceaccount.yaml
  - deployment.yaml
release:
  name: demo
set:
  image.repository: nginx
tests:
  - it: creates a ServiceAccount named after the release and uses it in the pod
    asserts:
      - isKind:
          of: ServiceAccount
        template: serviceaccount.yaml
      - equal:
          path: metadata.name
          value: demo-base-webapp
        template: serviceaccount.yaml
      - equal:
          path: automountServiceAccountToken
          value: true
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: demo-base-webapp
        template: deployment.yaml

  - it: honours serviceAccount.name, annotations and automount
    set:
      serviceAccount.name: custom
      serviceAccount.automount: false
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::1:role/x
    asserts:
      - equal:
          path: metadata.name
          value: custom
        template: serviceaccount.yaml
      - equal:
          path: automountServiceAccountToken
          value: false
        template: serviceaccount.yaml
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::1:role/x
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom
        template: deployment.yaml

  - it: renders no ServiceAccount and falls back to default when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
        template: deployment.yaml
