name: Publish chart to GHCR

# Releases are cut by pushing a tag that matches Chart.yaml's version, e.g.
# version: 0.8.0 -> git tag v0.8.0 && git push origin v0.8.0
#
# Editing this workflow on main also runs it, so pipeline changes can be tried
# without cutting a new tag. Path filters are not evaluated for tag pushes, so
# the tag trigger is unaffected. On those branch runs the chart is only pushed
# if Chart.yaml's version is not in GHCR yet -- a workflow edit never
# overwrites an already-published version.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/publish-chart.yaml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Chart.yaml version
        if: github.ref_type == 'tag'
        run: |
          chart_version=$(grep '^version:' Chart.yaml | awk '{print $2}')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$chart_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Chart.yaml version ${chart_version}"
            exit 1
          fi

      - name: Lint and render
        run: |
          helm version
          helm lint .
          helm template release . > /dev/null

      - name: Package
        run: helm package . -d dist

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          name=$(grep '^name:' Chart.yaml | awk '{print $2}')
          version=$(grep '^version:' Chart.yaml | awk '{print $2}')
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && \
             helm show chart "oci://ghcr.io/${owner}/charts/${name}" --version "${version}" >/dev/null 2>&1; then
            echo "::notice::${name}:${version} is already in GHCR; skipping push (branch run, not a release tag)."
            exit 0
          fi
          helm push dist/*.tgz "oci://ghcr.io/${owner}/charts"
          echo "Published oci://ghcr.io/${owner}/charts/${name}:${version}"
